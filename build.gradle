plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "pingdisplayoverlay" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

configurations.all {
    resolutionStrategy {
        // fabric-api 0.145.4+26.1.1's bundled fabric-lifecycle-events-v1 (4.0.6+a9b9c176b3) ships
        // mixins that expect an EntityLoadData interface which is missing from that specific jar,
        // breaking compilation of any code touching Entity/Player. Force the next patch release,
        // which restores the class and is otherwise API-compatible.
        force "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:4.1.1+df84eb3d4c"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "com.terraformersmc:modmenu:22.0.0-alpha.1"
}

tasks.withType(ProcessResources).configureEach {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.jar {
    archiveFileName = "Ping_Display+Overlay-Fabric-${project.mod_version}-26.1.1.jar"
}
